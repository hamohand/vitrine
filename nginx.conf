# Nginx — site statique Enclume numérique (derrière Traefik, qui gère le TLS)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # La page : toujours revalidée, pour que les mises à jour soient visibles tout de suite
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # CSS / JS / images : cache court (1 jour), les fichiers n'étant pas versionnés
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
